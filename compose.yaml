services:
  proxy:
    build: .
    command: ["run", "--config", "/etc/aegisproxy/config.toml"]
    depends_on:
      - upstream
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/container.toml:/etc/aegisproxy/config.toml:ro
      - proxy-state:/var/lib/aegisproxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: 2
    networks:
      edge:
        ipv4_address: 172.31.250.2

  upstream:
    image: nginx:1.27-alpine
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        ipv4_address: 172.31.250.10

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  proxy-state:

