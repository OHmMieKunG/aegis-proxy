schema_version = 1

# Placeholder paths must be replaced with outputs from `rust-proxy cert import`.

[tls]
minimum_version = "1.2"
max_handshakes = 256
handshake_timeout_secs = 10
identity = "file:///run/secrets/aegisproxy-age-identity"

[[listeners]]
id = "public-tls"
bind = "127.0.0.1:8443"
protocol = "https"
certificates = ["public-site"]

[[certificates]]
id = "public-site"
hosts = ["example.test"]
certificate_chain = "file:///var/lib/aegisproxy/certificates/public-site/generations/REPLACE/chain.pem"
private_key = "file:///var/lib/aegisproxy/certificates/public-site/generations/REPLACE/key.age"

[[upstream_groups]]
id = "app"
algorithm = "round_robin"
allowed_cidrs = ["127.0.0.1/32"]

[[upstream_groups.endpoints]]
id = "app-1"
url = "https://127.0.0.1:9443"
weight = 1
server_name = "upstream.example.test"
ca_bundle = "file:///run/secrets/upstream-ca.pem"

[[routes]]
id = "app"
listeners = ["public-tls"]
hosts = ["example.test"]
path_prefixes = ["/"]
upstream_group = "app"
