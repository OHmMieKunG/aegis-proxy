schema_version = 1

[tls]
minimum_version = "1.2"
max_handshakes = 256
handshake_timeout_secs = 10
identity = "file:///run/secrets/aegisproxy-age-identity"

[[listeners]]
id = "public-tls"
bind = "127.0.0.1:8443"
protocol = "https"
certificates = ["public-site"]

[[certificates]]
id = "public-site"
hosts = ["example.test"]
certificate_chain = "file:///var/lib/aegisproxy/certificates/public-site/generations/REPLACE/chain.pem"
private_key = "file:///var/lib/aegisproxy/certificates/public-site/generations/REPLACE/key.age"

[[upstream_groups]]
id = "application"
algorithm = "round_robin"
max_in_flight = 512
allowed_cidrs = ["127.0.0.1/32"]

[[upstream_groups.endpoints]]
id = "application-1"
url = "http://127.0.0.1:9000"
weight = 1

[[upstream_groups]]
id = "authentik-outpost"
algorithm = "round_robin"
max_in_flight = 64
allowed_cidrs = ["127.0.0.1/32"]

[[upstream_groups.endpoints]]
id = "authentik-1"
url = "http://127.0.0.1:9001"
weight = 1

[middlewares.edge-ip]
type = "ip_policy"
allow = ["192.0.2.0/24"]
deny = ["192.0.2.13/32"]

[middlewares.edge-rate]
type = "rate_limit"
key = "client_ip"
requests_per_second = 20
burst = 40
max_keys = 10000
idle_secs = 300

[middlewares.route-cap]
type = "in_flight_limit"
max_requests = 512
max_per_client = 32
status = 429

[middlewares.cors]
type = "cors"
origins = ["https://console.example.test"]
methods = ["GET", "POST", "OPTIONS"]
headers = ["content-type"]
allow_credentials = true
max_age_secs = 600

[middlewares.basic]
type = "basic_auth"
realm = "AegisProxy example"
users = { operator = "env://AEGISPROXY_EXAMPLE_OPERATOR_HASH" }
max_concurrent_verifications = 8
timeout_secs = 5

[middlewares.authentik]
type = "forward_auth"
upstream_group = "authentik-outpost"
path = "/outpost.goauthentik.io/auth/traefik"
request_headers = ["authorization", "cookie"]
response_headers = ["x-authentik-username", "x-authentik-email"]
principal_header = "x-authentik-username"
redirect_hosts = ["auth.example.test", "example.test"]
timeout_secs = 3

[middlewares.principal-rate]
type = "rate_limit"
key = "principal"
requests_per_second = 10
burst = 20
max_keys = 10000
idle_secs = 300

[middlewares.api-rewrite]
type = "rewrite"
from_prefix = "/api"
to = "/v1"

[middlewares.app-headers]
type = "header_mutation"
request_set = { "x-proxy-boundary" = "aegisproxy" }
response_set = { "cache-control" = "no-store" }
response_remove = ["server"]

[middlewares.security]
type = "security_headers"
hsts = "max-age=31536000"
content_security_policy = "default-src 'self'"
override_existing = false
acknowledge_hsts_risk = false

[middlewares.errors]
type = "custom_error"
statuses = [502, 503, 504]
body = "service temporarily unavailable\n"
content_type = "text/plain; charset=utf-8"

[middlewares.compress]
type = "compression"
encodings = ["brotli", "gzip"]
content_types = ["application/json", "text/plain"]
min_bytes = 1024
max_concurrent = 4
allow_authenticated = false

[middlewares.old-api]
type = "redirect"
location = "https://example.test/api"
status = 308
preserve_query = true

[middlewares.maintenance]
type = "maintenance"
status = 503
body = "planned maintenance\n"
content_type = "text/plain; charset=utf-8"
retry_after_secs = 120
authenticated = false

[[routes]]
id = "authentik-public"
listeners = ["public-tls"]
hosts = ["example.test"]
path_prefixes = ["/outpost.goauthentik.io"]
priority = 100
upstream_group = "authentik-outpost"

[[routes]]
id = "legacy-redirect"
listeners = ["public-tls"]
hosts = ["example.test"]
paths = ["/old-api"]
priority = 90
middlewares = ["old-api"]

[[routes]]
id = "maintenance-page"
listeners = ["public-tls"]
hosts = ["example.test"]
paths = ["/maintenance"]
priority = 80
middlewares = ["maintenance", "security"]

[[routes]]
id = "forward-auth-app"
listeners = ["public-tls"]
hosts = ["example.test"]
path_prefixes = ["/sso"]
priority = 70
middlewares = [
  "edge-ip",
  "edge-rate",
  "route-cap",
  "cors",
  "authentik",
  "principal-rate",
  "app-headers",
  "security",
  "errors",
  "compress",
]
upstream_group = "application"

[[routes]]
id = "basic-api"
listeners = ["public-tls"]
hosts = ["example.test"]
path_prefixes = ["/api"]
priority = 60
middlewares = [
  "edge-ip",
  "edge-rate",
  "route-cap",
  "cors",
  "basic",
  "api-rewrite",
  "app-headers",
  "security",
  "errors",
]
upstream_group = "application"
