schema_version = 1

[[listeners]]
id = "public"
bind = "127.0.0.1:8080"
protocol = "http"

[[upstream_groups]]
id = "app"
algorithm = "round_robin"

[[upstream_groups.endpoints]]
id = "app-1"
url = "http://127.0.0.1:9000"
weight = 1

[[routes]]
id = "app"
listeners = ["public"]
hosts = ["example.test"]
path_prefixes = ["/"]
upstream_group = "app"
