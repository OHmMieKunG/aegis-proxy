schema_version = 1

[runtime]
state_dir = "./state"
config_poll_secs = 1

[[listeners]]
id = "public"
bind = "127.0.0.1:8080"
protocol = "http"

[[upstream_groups]]
id = "app"
algorithm = "round_robin"
allowed_cidrs = ["192.0.2.0/24"]
denied_cidrs = ["169.254.0.0/16"]

[upstream_groups.dns]
lookup_timeout_secs = 3
max_answers = 16

[[upstream_groups.endpoints]]
id = "fallback"
url = "http://192.0.2.10:8080"
weight = 1

[[providers]]
kind = "dns"
id = "app-nodes"
enabled = false
upstream_group = "app"
hostname = "nodes.example.test"
port = 8080
scheme = "http"
weight = 1
refresh_secs = 30
stale_after_secs = 300
max_answers = 16

[[routes]]
id = "app"
listeners = ["public"]
hosts = ["example.test"]
path_prefixes = ["/"]
upstream_group = "app"
