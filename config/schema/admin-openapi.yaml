openapi: 3.1.0
info:
  title: AegisProxy private administration API
  version: 1.0.0
  description: >-
    Current private Unix-socket-only v1 contract. This document is not served by the daemon.
    Typed Proxy Host validation and preview are non-persistent and non-active.
servers:
  - url: http://localhost
    description: HTTP over the configured private Unix socket
paths:
  /live:
    get:
      operationId: liveProbe
      security: []
      responses:
        "200": {description: Process event loop is live}
  /ready:
    get:
      operationId: readyProbe
      security: []
      responses:
        "200": {description: Administration is ready}
        "503": {description: Durable recovery is required}
  /health/details:
    get:
      operationId: healthDetails
      responses:
        "200": {description: Authenticated redacted process and control-plane health}
        default: {$ref: "#/components/responses/Error"}
  /v1/live:
    get:
      operationId: live
      security: []
      responses:
        "200": {description: Process event loop is live}
  /v1/ready:
    get:
      operationId: ready
      security: []
      responses:
        "200": {description: Administration is ready}
        "503": {description: Durable recovery is required}
  /metrics:
    get:
      operationId: openMetrics
      responses:
        "200":
          description: Bounded OpenMetrics text exposition
          content:
            application/openmetrics-text:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/status:
    get:
      operationId: status
      responses:
        "200": {description: Redacted process status}
        default: {$ref: "#/components/responses/Error"}
  /v1/node/drain:
    post:
      operationId: drainNode
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      responses:
        "200": {description: Node is unready for external load-balancer drain}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/active:
    get:
      operationId: activeConfig
      responses:
        "200": {description: Redacted active configuration, with ETag}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/validate:
    post:
      operationId: validateConfig
      requestBody: {$ref: "#/components/requestBodies/TomlConfig"}
      responses:
        "200": {description: Candidate is valid}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/preview:
    post:
      operationId: previewConfig
      requestBody: {$ref: "#/components/requestBodies/TomlConfig"}
      responses:
        "200": {description: Redacted preview, fingerprints, and activation class; not a field-level diff}
        default: {$ref: "#/components/responses/Error"}
  /v1/proxy-hosts/validate:
    post:
      operationId: validateProxyHost
      requestBody: {$ref: "#/components/requestBodies/ProxyHostObject"}
      responses:
        "200":
          description: Owned Proxy Host compiles and passes semantic validation without persistence
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyHostValidation"}
        default: {$ref: "#/components/responses/Error"}
  /v1/proxy-hosts/preview:
    post:
      operationId: previewProxyHost
      requestBody: {$ref: "#/components/requestBodies/ProxyHostObject"}
      responses:
        "200":
          description: Redacted non-active candidate preview and typed creation diff
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PreparedProxyHost"}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/candidates:
    post:
      operationId: createCandidate
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody: {$ref: "#/components/requestBodies/TomlConfig"}
      responses:
        "201": {description: Immutable candidate persisted}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/candidates/{id}/activate:
    post:
      operationId: activateCandidate
      parameters:
        - {$ref: "#/components/parameters/RevisionId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200": {description: Candidate atomically activated}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/revisions:
    get:
      operationId: listRevisions
      parameters:
        - {$ref: "#/components/parameters/AfterSequence"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: Bounded revision page}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/revisions/{id}:
    get:
      operationId: getRevision
      parameters: [{$ref: "#/components/parameters/RevisionId"}]
      responses:
        "200": {description: Redacted immutable revision}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/revisions/{id}/rollback:
    post:
      operationId: rollbackRevision
      parameters:
        - {$ref: "#/components/parameters/RevisionId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200": {description: New forward revision activated}
        default: {$ref: "#/components/responses/Error"}
  /v1/routes:
    get:
      operationId: listRoutes
      responses:
        "200": {description: Effective redacted routes}
        default: {$ref: "#/components/responses/Error"}
  /v1/upstreams:
    get:
      operationId: listUpstreams
      responses:
        "200": {description: Redacted upstream summaries}
        default: {$ref: "#/components/responses/Error"}
  /v1/providers:
    get:
      operationId: listProviders
      responses:
        "200": {description: Redacted provider hash and freshness summaries}
        default: {$ref: "#/components/responses/Error"}
  /v1/certificates:
    get:
      operationId: listCertificates
      responses:
        "200": {description: Certificate policy metadata}
        default: {$ref: "#/components/responses/Error"}
  /v1/certificates/{id}/renew:
    post:
      operationId: renewCertificate
      parameters:
        - {$ref: "#/components/parameters/ObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200": {description: Renewal request persisted}
        default: {$ref: "#/components/responses/Error"}
  /v1/audit:
    get:
      operationId: listAudit
      parameters:
        - {$ref: "#/components/parameters/AfterSequence"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: Authenticated audit page}
        default: {$ref: "#/components/responses/Error"}
  /v1/tokens:
    get:
      operationId: listTokens
      responses:
        "200":
          description: Hash-free token metadata
          content:
            application/json:
              schema:
                type: array
                maxItems: 1024
                items: {$ref: "#/components/schemas/TokenMetadata"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createToken
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, scopes, expires_unix_secs]
              properties:
                role: {type: string, enum: [viewer, auditor, operator, admin]}
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 17
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/TokenScope"
                expires_unix_secs: {type: integer, minimum: 1}
      responses:
        "201":
          description: Plaintext token returned once
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssuedToken"}
        default: {$ref: "#/components/responses/Error"}
  /v1/tokens/{id}/revoke:
    post:
      operationId: revokeToken
      parameters:
        - {$ref: "#/components/parameters/ObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200": {description: Token revoked}
        default: {$ref: "#/components/responses/Error"}
  /v1/backups:
    post:
      operationId: createBackup
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [output]
              properties:
                output: {type: string, maxLength: 4096}
      responses:
        "200": {description: Encrypted backup created}
        default: {$ref: "#/components/responses/Error"}
  /v1/restore/validate:
    post:
      operationId: validateRestore
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input, identity]
              properties:
                input: {type: string, maxLength: 4096}
                identity: {type: string, description: env:// or absolute file:// secret reference}
      responses:
        "200": {description: Archive authenticated and validated without extraction}
        default: {$ref: "#/components/responses/Error"}
security:
  - bearerToken: []
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: Optional on the private socket; local peer credentials remain mandatory.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[0-9]{20}-[0-9a-f]{64}"$'}
    RevisionId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9]{20}-[0-9a-f]{64}$'}
    ObjectId:
      name: id
      in: path
      required: true
      schema: {type: string, maxLength: 128}
    AfterSequence:
      name: after_sequence
      in: query
      schema: {type: integer, minimum: 0}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 100}
  requestBodies:
    TomlConfig:
      required: true
      content:
        application/toml:
          schema: {type: string, format: binary, maxLength: 2097152}
    ProxyHostObject:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProxyHostObject"}
  responses:
    Error:
      description: Stable redacted error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ObjectId:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,63}$'
    ProxyHostObject:
      type: object
      additionalProperties: false
      required: [api_version, metadata, spec]
      properties:
        api_version: {const: v1}
        metadata:
          type: object
          additionalProperties: false
          required: [id, owner_id]
          properties:
            id: {$ref: "#/components/schemas/ObjectId"}
            owner_id: {$ref: "#/components/schemas/ObjectId"}
        spec:
          type: object
          additionalProperties: false
          required: [domain, forward_host, forward_port, forward_protocol, automatic_https, access_policy_ref, enabled]
          properties:
            domain: {type: string, minLength: 1, maxLength: 253}
            forward_host: {type: string, minLength: 1, maxLength: 253}
            forward_port: {type: integer, minimum: 1, maximum: 65535}
            forward_protocol: {type: string, enum: [http, https]}
            automatic_https: {type: string, enum: [disabled, managed]}
            access_policy_ref:
              oneOf:
                - {$ref: "#/components/schemas/ObjectId"}
                - {type: "null"}
            enabled: {type: boolean}
    GeneratedProxyHost:
      type: object
      additionalProperties: false
      required: [route_id, listener_id, upstream_group_id, endpoint_id]
      properties:
        route_id: {type: string}
        listener_id: {type: string}
        upstream_group_id: {type: string}
        endpoint_id: {type: string}
    ProxyHostSummary:
      type: object
      additionalProperties: false
      required: [api_version, object_id, owner_id, domain, forward_host, forward_port, forward_protocol, automatic_https, access_policy_ref, enabled, generated, candidate_hash, active_route_fingerprint, candidate_route_fingerprint, activation]
      properties:
        api_version: {const: v1}
        object_id: {$ref: "#/components/schemas/ObjectId"}
        owner_id: {$ref: "#/components/schemas/ObjectId"}
        domain: {type: string}
        forward_host: {type: string}
        forward_port: {type: integer, minimum: 1, maximum: 65535}
        forward_protocol: {type: string, enum: [http, https]}
        automatic_https: {type: string, enum: [disabled, managed]}
        access_policy_ref:
          oneOf:
            - {$ref: "#/components/schemas/ObjectId"}
            - {type: "null"}
        enabled: {type: boolean}
        generated:
          oneOf:
            - {$ref: "#/components/schemas/GeneratedProxyHost"}
            - {type: "null"}
        candidate_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        active_route_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
        candidate_route_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
        activation: {type: string, enum: [hot_reload, restart_required]}
    ProxyHostValidation:
      type: object
      additionalProperties: false
      required: [valid, summary]
      properties:
        valid: {const: true}
        summary: {$ref: "#/components/schemas/ProxyHostSummary"}
    PreparedProxyHost:
      type: object
      additionalProperties: false
      required: [preview, diff]
      properties:
        preview:
          type: object
          additionalProperties: false
          required: [summary, redacted_config]
          properties:
            summary: {$ref: "#/components/schemas/ProxyHostSummary"}
            redacted_config: {type: object, description: Canonical configuration with all secret references redacted}
        diff:
          type: object
          description: Bounded ordered typed creation diff; see response discriminator values
          additionalProperties: false
          required: [api_version, object_id, owner_id, current_hash, candidate_hash, changes]
          properties:
            api_version: {const: v1}
            object_id: {$ref: "#/components/schemas/ObjectId"}
            owner_id: {$ref: "#/components/schemas/ObjectId"}
            current_hash: {type: "null"}
            candidate_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
            changes: {type: array, minItems: 7, maxItems: 8, items: {type: object}}
    TokenScope:
      type: string
      enum: [read_status, read_config, validate_config, preview_config, create_candidate, activate_config, rollback_config, read_revisions, read_routes, read_upstreams, drain, read_certificates, renew_certificate, read_audit, create_backup, validate_restore, manage_identities]
    TokenMetadata:
      type: object
      additionalProperties: false
      required: [id, role, owner_id, scopes, expires_unix_secs, revoked]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9_-]{16}$'}
        role: {type: string, enum: [viewer, auditor, operator, admin]}
        owner_id:
          oneOf:
            - {$ref: "#/components/schemas/ObjectId"}
            - {type: "null"}
        scopes:
          type: array
          maxItems: 17
          uniqueItems: true
          items: {$ref: "#/components/schemas/TokenScope"}
        expires_unix_secs: {type: integer, minimum: 1}
        revoked: {type: boolean}
    IssuedToken:
      type: object
      additionalProperties: false
      required: [token, metadata]
      properties:
        token: {type: string, description: Plaintext returned once and never persisted}
        metadata: {$ref: "#/components/schemas/TokenMetadata"}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: array, items: {type: object}}
            request_id: {type: string}
