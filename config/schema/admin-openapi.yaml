openapi: 3.1.0
info:
  title: AegisProxy private administration API
  version: 1.0.0
  description: >-
    Current private Unix-socket-only v1 contract. This document is not served by the daemon.
    Typed Proxy Host validation and preview are non-persistent. Mutations persist owned desired
    state and an immutable candidate but never activate it.
servers:
  - url: http://localhost
    description: HTTP over the configured private Unix socket
paths:
  /live:
    get:
      operationId: liveProbe
      security: []
      responses:
        "200": {description: Process event loop is live}
  /ready:
    get:
      operationId: readyProbe
      security: []
      responses:
        "200": {description: Administration is ready}
        "503": {description: Durable recovery is required}
  /health/details:
    get:
      operationId: healthDetails
      responses:
        "200": {description: Authenticated redacted process and control-plane health}
        default: {$ref: "#/components/responses/Error"}
  /v1/live:
    get:
      operationId: live
      security: []
      responses:
        "200": {description: Process event loop is live}
  /v1/ready:
    get:
      operationId: ready
      security: []
      responses:
        "200": {description: Administration is ready}
        "503": {description: Durable recovery is required}
  /metrics:
    get:
      operationId: openMetrics
      responses:
        "200":
          description: Bounded OpenMetrics text exposition
          content:
            application/openmetrics-text:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/status:
    get:
      operationId: status
      responses:
        "200": {description: Redacted process status}
        default: {$ref: "#/components/responses/Error"}
  /v1/node/drain:
    post:
      operationId: drainNode
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      responses:
        "200": {description: Node is unready for external load-balancer drain}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/active:
    get:
      operationId: activeConfig
      responses:
        "200": {description: Redacted active configuration, with ETag}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/validate:
    post:
      operationId: validateConfig
      requestBody: {$ref: "#/components/requestBodies/TomlConfig"}
      responses:
        "200": {description: Candidate is valid}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/preview:
    post:
      operationId: previewConfig
      requestBody: {$ref: "#/components/requestBodies/TomlConfig"}
      responses:
        "200": {description: Redacted preview, fingerprints, and activation class; not a field-level diff}
        default: {$ref: "#/components/responses/Error"}
  /v1/access-policies:
    get:
      operationId: listAccessPolicies
      responses:
        "200":
          description: Stable object-ID ordered Access Policies owned by authenticated principal
          content:
            application/json:
              schema:
                type: array
                maxItems: 1024
                items: {$ref: "#/components/schemas/StoredAccessPolicy"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createAccessPolicy
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccessPolicyObject"}
      responses:
        "201":
          description: Owned Access Policy desired state persisted without runtime activation; object generation is returned as ETag
          headers:
            ETag:
              description: Quoted object generation
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoredAccessPolicy"}
        default: {$ref: "#/components/responses/Error"}
  /v1/access-policies/{id}:
    get:
      operationId: getAccessPolicy
      parameters: [{$ref: "#/components/parameters/TypedObjectId"}]
      responses:
        "200":
          description: Owned Access Policy desired state and object-generation ETag
          headers:
            ETag:
              description: Quoted object generation
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoredAccessPolicy"}
        default: {$ref: "#/components/responses/Error"}
    put:
      operationId: updateAccessPolicy
      parameters:
        - {$ref: "#/components/parameters/TypedObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/ObjectGeneration"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccessPolicyObject"}
      responses:
        "200":
          description: Owned Access Policy desired state replaced without runtime activation
          headers:
            ETag:
              description: Quoted object generation
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoredAccessPolicy"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteAccessPolicy
      parameters:
        - {$ref: "#/components/parameters/TypedObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/ObjectGeneration"}
      responses:
        "200":
          description: Owned Access Policy desired state deleted without runtime activation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoredAccessPolicy"}
        default: {$ref: "#/components/responses/Error"}
  /v1/proxy-hosts:
    get:
      operationId: listProxyHosts
      responses:
        "200":
          description: Stable object-ID ordered Proxy Hosts owned by authenticated principal
          content:
            application/json:
              schema:
                type: array
                maxItems: 4096
                items: {$ref: "#/components/schemas/StoredProxyHost"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createProxyHost
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody: {$ref: "#/components/requestBodies/ProxyHostObject"}
      responses:
        "201":
          description: Owned desired state and immutable non-active candidate created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyHostCreate"}
        default: {$ref: "#/components/responses/Error"}
  /v1/proxy-hosts/{id}:
    get:
      operationId: getProxyHost
      parameters: [{$ref: "#/components/parameters/TypedObjectId"}]
      responses:
        "200":
          description: Owned Proxy Host desired state and object-generation ETag
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoredProxyHost"}
        default: {$ref: "#/components/responses/Error"}
    put:
      operationId: updateProxyHost
      parameters:
        - {$ref: "#/components/parameters/TypedObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/ObjectGeneration"}
      requestBody: {$ref: "#/components/requestBodies/ProxyHostObject"}
      responses:
        "200":
          description: Owned desired state replaced and immutable non-active candidate created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyHostCreate"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteProxyHost
      parameters:
        - {$ref: "#/components/parameters/TypedObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/ObjectGeneration"}
      responses:
        "200":
          description: Owned desired state removed and immutable non-active candidate created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyHostDelete"}
        default: {$ref: "#/components/responses/Error"}
  /v1/proxy-hosts/validate:
    post:
      operationId: validateProxyHost
      requestBody: {$ref: "#/components/requestBodies/ProxyHostObject"}
      responses:
        "200":
          description: Owned Proxy Host compiles and passes semantic validation without persistence
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyHostValidation"}
        default: {$ref: "#/components/responses/Error"}
  /v1/proxy-hosts/preview:
    post:
      operationId: previewProxyHost
      requestBody: {$ref: "#/components/requestBodies/ProxyHostObject"}
      responses:
        "200":
          description: Redacted non-active candidate preview and typed creation diff
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PreparedProxyHost"}
        default: {$ref: "#/components/responses/Error"}
  /v1/proxy-hosts/candidates/{id}/activate:
    post:
      operationId: activateProxyHostCandidate
      parameters:
        - {$ref: "#/components/parameters/RevisionId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200":
          description: Verified complete desired-state candidate atomically activated
        default: {$ref: "#/components/responses/Error"}
  /v1/proxy-hosts/revisions/{id}/rollback:
    post:
      operationId: rollbackProxyHosts
      parameters:
        - {$ref: "#/components/parameters/RevisionId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200":
          description: Bound typed desired state restored through a new active forward revision
        default: {$ref: "#/components/responses/Error"}
  /v1/config/typed-candidates/{id}/preview:
    get:
      operationId: previewTypedCandidate
      parameters: [{$ref: "#/components/parameters/RevisionId"}]
      responses:
        "200": {description: Redacted unified typed candidate preview}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/typed-candidates/{id}/activate:
    post:
      operationId: activateTypedCandidate
      parameters:
        - {$ref: "#/components/parameters/RevisionId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200": {description: Verified schema-2 typed candidate activated}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/typed-revisions/{id}/rollback:
    post:
      operationId: rollbackTypedRevision
      parameters:
        - {$ref: "#/components/parameters/RevisionId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200": {description: Unified typed state restored through a forward revision}
        default: {$ref: "#/components/responses/Error"}
  /v1/stream-hosts:
    get:
      operationId: listStreamHosts
      responses:
        "200": {description: Owner-scoped Stream Hosts}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createStreamHost
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody: {$ref: "#/components/requestBodies/StreamHostObject"}
      responses:
        "201": {description: Stream Host and non-active candidate created}
        default: {$ref: "#/components/responses/Error"}
  /v1/stream-hosts/{id}:
    get:
      operationId: getStreamHost
      parameters: [{$ref: "#/components/parameters/TypedObjectId"}]
      responses:
        "200": {description: Owner-scoped Stream Host}
        default: {$ref: "#/components/responses/Error"}
    put:
      operationId: updateStreamHost
      parameters:
        - {$ref: "#/components/parameters/TypedObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/ObjectGeneration"}
      requestBody: {$ref: "#/components/requestBodies/StreamHostObject"}
      responses:
        "200": {description: Stream Host replaced and non-active candidate created}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteStreamHost
      parameters:
        - {$ref: "#/components/parameters/TypedObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/ObjectGeneration"}
      responses:
        "200": {description: Stream Host deleted and non-active candidate created}
        default: {$ref: "#/components/responses/Error"}
  /v1/stream-hosts/validate:
    post:
      operationId: validateStreamHost
      requestBody: {$ref: "#/components/requestBodies/StreamHostObject"}
      responses:
        "200": {description: Stream Host is valid without persistence}
        default: {$ref: "#/components/responses/Error"}
  /v1/stream-hosts/preview:
    post:
      operationId: previewStreamHost
      requestBody: {$ref: "#/components/requestBodies/StreamHostObject"}
      responses:
        "200": {description: Redacted non-active Stream Host candidate preview}
        default: {$ref: "#/components/responses/Error"}
  /v1/discovery-sources:
    get:
      operationId: listDiscoverySources
      responses:
        "200": {description: Owner-scoped Discovery Sources}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createDiscoverySource
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody: {$ref: "#/components/requestBodies/DiscoverySourceObject"}
      responses:
        "201": {description: Discovery Source and non-active candidate created}
        default: {$ref: "#/components/responses/Error"}
  /v1/discovery-sources/{id}:
    get:
      operationId: getDiscoverySource
      parameters: [{$ref: "#/components/parameters/TypedObjectId"}]
      responses:
        "200": {description: Owner-scoped Discovery Source}
        default: {$ref: "#/components/responses/Error"}
    put:
      operationId: updateDiscoverySource
      parameters:
        - {$ref: "#/components/parameters/TypedObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/ObjectGeneration"}
      requestBody: {$ref: "#/components/requestBodies/DiscoverySourceObject"}
      responses:
        "200": {description: Discovery Source replaced and non-active candidate created}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteDiscoverySource
      parameters:
        - {$ref: "#/components/parameters/TypedObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/ObjectGeneration"}
      responses:
        "200": {description: Discovery Source deleted and non-active candidate created}
        default: {$ref: "#/components/responses/Error"}
  /v1/discovery-sources/validate:
    post:
      operationId: validateDiscoverySource
      requestBody: {$ref: "#/components/requestBodies/DiscoverySourceObject"}
      responses:
        "200": {description: Discovery Source is valid without persistence or I/O}
        default: {$ref: "#/components/responses/Error"}
  /v1/discovery-sources/preview:
    post:
      operationId: previewDiscoverySource
      requestBody: {$ref: "#/components/requestBodies/DiscoverySourceObject"}
      responses:
        "200": {description: Redacted non-active Discovery Source candidate preview}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/candidates:
    post:
      operationId: createCandidate
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody: {$ref: "#/components/requestBodies/TomlConfig"}
      responses:
        "201": {description: Immutable candidate persisted}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/candidates/{id}/activate:
    post:
      operationId: activateCandidate
      parameters:
        - {$ref: "#/components/parameters/RevisionId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200": {description: Candidate atomically activated}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/revisions:
    get:
      operationId: listRevisions
      parameters:
        - {$ref: "#/components/parameters/AfterSequence"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: Bounded revision page}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/revisions/{id}:
    get:
      operationId: getRevision
      parameters: [{$ref: "#/components/parameters/RevisionId"}]
      responses:
        "200": {description: Redacted immutable revision}
        default: {$ref: "#/components/responses/Error"}
  /v1/config/revisions/{id}/rollback:
    post:
      operationId: rollbackRevision
      parameters:
        - {$ref: "#/components/parameters/RevisionId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200": {description: New forward revision activated}
        default: {$ref: "#/components/responses/Error"}
  /v1/routes:
    get:
      operationId: listRoutes
      responses:
        "200": {description: Effective redacted routes}
        default: {$ref: "#/components/responses/Error"}
  /v1/upstreams:
    get:
      operationId: listUpstreams
      responses:
        "200": {description: Redacted upstream summaries}
        default: {$ref: "#/components/responses/Error"}
  /v1/runtime/providers:
    get:
      operationId: listProviders
      responses:
        "200": {description: Redacted provider hash and freshness summaries}
        default: {$ref: "#/components/responses/Error"}
  /v1/certificates:
    get:
      operationId: listCertificates
      responses:
        "200": {description: Owner-scoped typed Certificate objects}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createCertificate
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody: {$ref: "#/components/requestBodies/CertificateObject"}
      responses:
        "201": {description: Certificate object persisted}
        default: {$ref: "#/components/responses/Error"}
  /v1/certificates/{id}:
    get:
      operationId: getCertificate
      parameters: [{$ref: "#/components/parameters/TypedObjectId"}]
      responses:
        "200": {description: Owner-scoped typed Certificate object}
        default: {$ref: "#/components/responses/Error"}
    put:
      operationId: updateCertificate
      parameters:
        - {$ref: "#/components/parameters/TypedObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/ObjectGeneration"}
      requestBody: {$ref: "#/components/requestBodies/CertificateObject"}
      responses:
        "200": {description: Certificate object replaced}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteCertificate
      parameters:
        - {$ref: "#/components/parameters/TypedObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/ObjectGeneration"}
      responses:
        "200": {description: Certificate object deleted}
        default: {$ref: "#/components/responses/Error"}
  /v1/certificates/{id}/renew:
    post:
      operationId: renewCertificate
      parameters:
        - {$ref: "#/components/parameters/ObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200": {description: Renewal request persisted}
        default: {$ref: "#/components/responses/Error"}
  /v1/runtime/certificates:
    get:
      operationId: listRuntimeCertificates
      responses:
        "200": {description: Observed runtime certificate status}
        default: {$ref: "#/components/responses/Error"}
  /v1/runtime/certificates/{id}/renew:
    post:
      operationId: renewRuntimeCertificate
      parameters:
        - {$ref: "#/components/parameters/ObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200": {description: Runtime certificate renewal request persisted}
        default: {$ref: "#/components/responses/Error"}
  /v1/audit:
    get:
      operationId: listAudit
      parameters:
        - {$ref: "#/components/parameters/AfterSequence"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: Authenticated audit page}
        default: {$ref: "#/components/responses/Error"}
  /v1/tokens:
    get:
      operationId: listTokens
      responses:
        "200":
          description: Hash-free token metadata
          content:
            application/json:
              schema:
                type: array
                maxItems: 1024
                items: {$ref: "#/components/schemas/TokenMetadata"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createToken
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, scopes, expires_unix_secs]
              properties:
                role: {type: string, enum: [viewer, auditor, operator, admin]}
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 41
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/TokenScope"
                expires_unix_secs: {type: integer, minimum: 1}
      responses:
        "201":
          description: Plaintext token returned once
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssuedToken"}
        default: {$ref: "#/components/responses/Error"}
  /v1/tokens/{id}/revoke:
    post:
      operationId: revokeToken
      parameters:
        - {$ref: "#/components/parameters/ObjectId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200": {description: Token revoked}
        default: {$ref: "#/components/responses/Error"}
  /v1/backups:
    post:
      operationId: createBackup
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [output]
              properties:
                output: {type: string, maxLength: 4096}
      responses:
        "200": {description: Encrypted backup created}
        default: {$ref: "#/components/responses/Error"}
  /v1/restore/validate:
    post:
      operationId: validateRestore
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input, identity]
              properties:
                input: {type: string, maxLength: 4096}
                identity: {type: string, description: env:// or absolute file:// secret reference}
      responses:
        "200": {description: Archive authenticated and validated without extraction}
        default: {$ref: "#/components/responses/Error"}
security:
  - bearerToken: []
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: Optional on the private socket; local peer credentials remain mandatory.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[0-9]{20}-[0-9a-f]{64}"$'}
    RevisionId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9]{20}-[0-9a-f]{64}$'}
    ObjectId:
      name: id
      in: path
      required: true
      schema: {type: string, maxLength: 128}
    TypedObjectId:
      name: id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ObjectId"}
    ObjectGeneration:
      name: X-Aegis-Object-Generation
      in: header
      required: true
      schema: {type: integer, minimum: 1}
    AfterSequence:
      name: after_sequence
      in: query
      schema: {type: integer, minimum: 0}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 100}
  requestBodies:
    TomlConfig:
      required: true
      content:
        application/toml:
          schema: {type: string, format: binary, maxLength: 2097152}
    ProxyHostObject:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProxyHostObject"}
    CertificateObject:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CertificateObject"}
    StreamHostObject:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/StreamHostObject"}
    DiscoverySourceObject:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DiscoverySourceObject"}
  responses:
    Error:
      description: Stable redacted error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ObjectId:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,63}$'
    MiddlewareRef:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,62}$'
    ProxyHostObject:
      type: object
      additionalProperties: false
      required: [api_version, metadata, spec]
      properties:
        api_version: {const: v1}
        metadata:
          type: object
          additionalProperties: false
          required: [id, owner_id]
          properties:
            id: {$ref: "#/components/schemas/ObjectId"}
            owner_id: {$ref: "#/components/schemas/ObjectId"}
        spec:
          type: object
          additionalProperties: false
          required: [domain, forward_host, forward_port, forward_protocol, automatic_https, access_policy_ref, enabled]
          properties:
            domain: {type: string, minLength: 1, maxLength: 253}
            forward_host: {type: string, minLength: 1, maxLength: 253}
            forward_port: {type: integer, minimum: 1, maximum: 65535}
            forward_protocol: {type: string, enum: [http, https]}
            automatic_https: {type: string, enum: [disabled, managed]}
            access_policy_ref:
              oneOf:
                - {$ref: "#/components/schemas/ObjectId"}
                - {type: "null"}
            enabled: {type: boolean}
    StoredProxyHost:
      type: object
      additionalProperties: false
      required: [generation, object]
      properties:
        generation: {type: integer, minimum: 1}
        object: {$ref: "#/components/schemas/ProxyHostObject"}
    AccessPolicyObject:
      type: object
      additionalProperties: false
      required: [api_version, metadata, spec]
      properties:
        api_version: {const: v1}
        metadata:
          type: object
          additionalProperties: false
          required: [id, owner_id]
          properties:
            id: {$ref: "#/components/schemas/ObjectId"}
