schema_version = 1

[runtime]
state_dir = "/var/lib/aegisproxy"

[[listeners]]
id = "public"
bind = "0.0.0.0:8080"
protocol = "http"

[[upstream_groups]]
id = "example"
algorithm = "round_robin"
allowed_cidrs = ["172.31.250.0/24"]

[[upstream_groups.endpoints]]
id = "example-1"
url = "http://172.31.250.10:80"
weight = 1

[[routes]]
id = "example"
listeners = ["public"]
hosts = ["localhost"]
path_prefixes = ["/"]
upstream_group = "example"

