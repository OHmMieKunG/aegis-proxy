[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "Transitive build-time localization macro from age; no vulnerability or runtime path; review/expiry 2026-10-19 in docs/security/dependency-unsafe-review.md" },
    { id = "RUSTSEC-2023-0071", reason = "Transitive through openidconnect. AegisProxy uses OIDC client-secret authentication and provider public-key ID-token verification; it does not invoke RustCrypto RSA private-key operations. TLS private keys are handled separately by rustls with the aws_lc_rs provider. See docs/security/rsa-marvin-advisory-disposition.md; review/expiry 2026-11-05." },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
