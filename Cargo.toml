[workspace]
members = [
    "crates/proxy-core",
    "crates/proxy-config",
    "crates/proxy-secrets",
    "crates/proxy-tls",
    "crates/proxy-admin",
    "crates/rust-proxy",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["AegisProxy contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
