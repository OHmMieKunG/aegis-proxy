[package]
name = "aegisproxy-tls"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aegisproxy-secrets = { path = "../proxy-secrets" }
arc-swap = "1"
bytes = "1"
fs2 = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "hyper-rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2"
rustls-webpki = { version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
toml = "0.8"
url = "2"
webpki-roots = "1"
x509-parser = { version = "0.18", default-features = false }
zeroize = { version = "1", features = ["std"] }

[dev-dependencies]
age = { version = "0.11.2", default-features = false }
