[package]
name = "aegisproxy-tls"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aegisproxy-secrets = { path = "../proxy-secrets" }
arc-swap = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2"
rustls-webpki = { version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
toml = "0.8"
webpki-roots = "1"
x509-parser = { version = "0.18", default-features = false }

[dev-dependencies]
age = { version = "0.11.2", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
