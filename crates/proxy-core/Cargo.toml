[package]
name = "aegisproxy-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aegisproxy-config = { path = "../proxy-config" }
aegisproxy-secrets = { path = "../proxy-secrets" }
aegisproxy-tls = { path = "../proxy-tls" }
arc-swap = "1"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
async-compression = { version = "0.4.42", default-features = false, features = ["brotli", "gzip", "tokio"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hickory-resolver = { version = "0.26.1", default-features = false, features = ["system-config", "tokio"] }
getrandom = "0.3"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server", "server-auto", "tokio"] }
ipnet = "2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing = "0.1"
tower-service = "0.3"
zeroize = { version = "1", features = ["std"] }

[dev-dependencies]
age = { version = "0.11.2", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
toml = "0.8"
