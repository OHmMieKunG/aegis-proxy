[package]
name = "aegisproxy-admin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aegisproxy-config = { path = "../proxy-config" }
aegisproxy-core = { path = "../proxy-core" }
aegisproxy-secrets = { path = "../proxy-secrets" }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
zeroize = { version = "1", features = ["std"] }

[dev-dependencies]
age = { version = "0.11.2", default-features = false }
