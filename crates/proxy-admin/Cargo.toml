[package]
name = "aegisproxy-admin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aegisproxy-config = { version = "=0.1.0", path = "../proxy-config" }
aegisproxy-core = { version = "=0.1.0", path = "../proxy-core" }
aegisproxy-secrets = { version = "=0.1.0", path = "../proxy-secrets" }
aegisproxy-tls = { version = "=0.1.0", path = "../proxy-tls" }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
bytes = "1"
fs2 = "0.4.3"
getrandom = "0.3"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
openidconnect = { version = "4.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
zeroize = { version = "1", features = ["std"] }

[dev-dependencies]
age = { version = "0.11.2", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
